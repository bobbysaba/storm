name: storm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14
  # Scientific / meteorology stack
  - metpy=1.7.1
  - scipy=1.18.1
  - numpy=2.5.4
  - matplotlib-base=3.10.9
  - pandas=3.1.1
  - xarray=2026.9.0
  - cartopy=0.26.0
  - pyproj=3.8.0
  - shapely=2.2.0
  - pillow=13.0.0
  - h5py
  - h5netcdf
  # Networking
  - paho-mqtt=2.2.0
  - requests=2.34.2
  - boto3=1.43.127
  # Utilities
  - pyserial
  - pynmea2
  - git
  - pip
  - pip:
      - pyqt6==6.10.2
      - pyqt6-qt6==6.10.2
      - pyqt6-sip==13.11.0
      - pyqt6-webengine==6.10.0
      - pyqt6-webengine-qt6==6.10.2
