name: storm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Scientific / meteorology stack
  - metpy=1.7.1
  - scipy=1.17.1
  - numpy=2.4.2
  - matplotlib-base=3.10.8
  - pandas=3.0.1
  - xarray=2026.2.0
  - cartopy=0.25.0
  - pyproj=3.7.2
  - shapely=2.1.2
  - pillow=12.1.1
  # Networking
  - paho-mqtt=2.1.0
  - requests=2.32.5
  - boto3=1.42.59         # AWS S3 (future use)
  # Utilities
  - pyserial             # GPS (NMEA via serial port)
  - pynmea2              # NMEA sentence parsing
  - pip
  - pip:
      # Qt UI — pyqt6-webengine is not on conda-forge for Linux; use pip manylinux wheels
      - pyqt6
      - pyqt6-qt6
      - pyqt6-sip
      - pyqt6-webengine
      - pyqt6-webengine-qt6
